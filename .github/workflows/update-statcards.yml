name: Update statcards

on:
  schedule:
    # 排程台灣時間 03:17、11:17（UTC+8），GitHub 實際約延遲 4～7 小時
    # 換日前的快照由 Cloudflare Worker 於台灣時間 23:50 以 workflow_dispatch 觸發
    - cron: '17 3,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'scripts/**'
      - '.github/workflows/update-statcards.yml'

permissions:
  contents: write

concurrency:
  group: update-statcards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-statcards.mjs

      - name: Commit updated statcards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges cards data
          if git diff --cached --quiet; then
            echo 'No badge changes.'
            exit 0
          fi
          git commit -m "chore: update badges ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # run 被延遲或兩次執行重疊時，檢出的 sha 會落後於 main，直接 push 會被拒。
          # 產出每次都是從當下的 API 資料重新算出來的，接到最新的 main 後面即可。
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
